services:
  nginx:
    image: nginx:1.25-alpine
    container_name: blog_nginx
    ports:
      - "8086:80"
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php
    networks:
      - blog_net
    restart: unless-stopped

  php:
    build:
      context: ./docker/php
    container_name: blog_php
    volumes:
      - ./:/var/www/html
    env_file:
      - .env
    networks:
      - blog_net
    restart: unless-stopped

networks:
  blog_net:
    driver: bridge